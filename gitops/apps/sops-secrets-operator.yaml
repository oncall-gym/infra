apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://isindir.github.io/sops-secrets-operator/
    chart: sops-secrets-operator
    targetRevision: 0.28.1 # helm search repo sops/sops-secrets-operator
    helm:
      releaseName: sops
      valuesObject:
        # Приватный ключ age кладёт в кластер bootstrap.sh, в Git его нет
        secretsAsFiles:
          - mountPath: /etc/sops-age-key-file
            name: sops-age-key-file
            secretName: sops-age-key-file
        extraEnv:
          - name: SOPS_AGE_KEY_FILE
            value: /etc/sops-age-key-file/key
  destination:
    server: https://kubernetes.default.svc
    namespace: sops-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
