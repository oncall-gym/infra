# Gateway API resource types. Cilium 1.20 is built against v1.6.1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.1
    path: config/crd
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false # never delete resource types automatically
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # the definitions are too large for a regular apply
