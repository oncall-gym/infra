# Типы ресурсов Gateway API. Cilium 1.20 собран под версию v1.6.1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.1
    path: config/crd
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false # типы ресурсов не удаляем автоматически
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # описания слишком большие для обычного apply
