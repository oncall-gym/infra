apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.6
      helm:
        releaseName: argocd
        valueFiles:
          - $values/gitops/argocd/values.yaml
    - repoURL: git@github.com:artem-dev-ops/DevOps-Troubleshoot-Training.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
