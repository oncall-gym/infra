# Зашифрованные секреты платформы. Argo CD применяет объекты SopsSecret
# как есть, а оператор расшифровывает их в обычные Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:artem-dev-ops/DevOps-Troubleshoot-Training.git # адрес репозитория, как в root.yaml
    targetRevision: main
    path: gitops/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
