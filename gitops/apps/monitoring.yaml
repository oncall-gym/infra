# Metrics, alerts and Grafana in one chart: VictoriaMetrics instead of Prometheus,
# because with the same compatibility it needs noticeably less memory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.95.2 # helm search repo vm/victoria-metrics-k8s-stack
    helm:
      releaseName: vmks
      values: |
        fullnameOverride: vmks

        vmsingle:
          spec:
            retentionPeriod: 7d
            storage: null
            volumes:
              - name: data
                emptyDir: {}

        alertmanager:
          spec:
            configSecret: alertmanager-config

        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false

        grafana:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # The Grafana password is generated on every chart render; without this
  # the application would be OutOfSync forever (as the chart documentation recommends)
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: vmks-grafana
      namespace: monitoring
      jsonPointers:
        - /data/admin-password
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the operator's type definitions are too large
      - RespectIgnoreDifferences=true
    # node-exporter reads host data, which Talos forbids by default
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
