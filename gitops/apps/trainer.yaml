apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trainer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:oncall-gym/infra.git
    targetRevision: main
    path: gitops/trainer
  destination:
    server: https://kubernetes.default.svc
    namespace: trainer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
