apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.20.2 # та же версия, что в bootstrap.sh
      helm:
        releaseName: cilium
        valueFiles:
          - $values/gitops/cilium/values.yaml
    - repoURL: git@github.com:artem-dev-ops/DevOps-Troubleshoot-Training.git # адрес репозитория, как в root.yaml
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
