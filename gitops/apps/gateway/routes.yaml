apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - argocd.lab.home.arpa
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: kube-system
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - hubble.lab.home.arpa
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
