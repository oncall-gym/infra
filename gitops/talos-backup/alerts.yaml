apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: talos-backup
  namespace: monitoring
spec:
  groups:
    - name: talos-backup
      rules:
        # 16 h threshold: the cluster is shut down overnight, otherwise the alert would fire every morning
        - alert: EtcdBackupTooOld
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="talos-backup", cronjob="talos-backup"} > 16 * 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The last successful etcd backup is older than 16 hours"
            description: "Check: kubectl -n talos-backup get jobs; logs of the latest pod."
        - alert: EtcdBackupNeverSucceeded
          expr: |
            absent(kube_cronjob_status_last_successful_time{namespace="talos-backup", cronjob="talos-backup"})
          for: 12h
          labels:
            severity: warning
          annotations:
            summary: "The talos-backup CronJob has not had a single successful run yet"
