# The single entry point. Cilium creates a LoadBalancer service for it,
# MetalLB hands out the address, cert-manager issues the certificate from the annotation.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      metallb.io/loadBalancerIPs: 192.168.91.220
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.home.arpa"
      allowedRoutes:
        namespaces:
          from: Same # port 80 serves only the redirect
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.home.arpa"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
