# Единая точка входа для HTTP. Cilium создаст для неё сервис типа
# LoadBalancer, а MetalLB выдаст ему закреплённый адрес.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  namespace: gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      metallb.io/loadBalancerIPs: 192.168.91.220
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.home.arpa"
      allowedRoutes:
        namespaces:
          from: All
