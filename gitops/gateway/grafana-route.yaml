apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.lab.home.arpa
  rules:
    - backendRefs:
        - name: vmks-grafana
          port: 80
