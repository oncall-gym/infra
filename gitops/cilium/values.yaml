# Cilium settings for Talos (following the Talos 1.14 documentation)
ipam:
  mode: kubernetes

# Cilium takes over the job of kube-proxy
kubeProxyReplacement: true

# KubePrism: the local Talos load balancer in front of the API server
k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Save memory in the lab
operator:
  replicas: 1

hubble:
  relay:
    enabled: true
  ui:
    enabled: true

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
