# Настройки Cilium под Talos (по документации Talos 1.14)
ipam:
  mode: kubernetes

# Cilium берёт на себя работу kube-proxy
kubeProxyReplacement: true

# KubePrism: локальный балансировщик Talos перед API-сервером
k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Экономим память на стенде
operator:
  replicas: 1

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
