global:
  domain: argocd.lab.home.arpa

# Save memory: the lab does not need notifications. Dex stays on for GitHub login
dex:
  enabled: true 
notifications:
  enabled: false

configs:
  params:
    server.insecure: true
  cm:
    admin.enabled: "false"
    url: https://argocd.lab.home.arpa
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $argocd-github-oauth:clientID
            clientSecret: $argocd-github-oauth:clientSecret
            # Only members of the organization can log in; their teams
            # arrive in the groups claim as <org>:<team>
            orgs:
              - name: oncall-gym
  rbac:
    policy.default: ""
    scopes: "[groups, email]"
    policy.csv: |
      g, oncall-gym:admins, role:admin
