global:
  domain: argocd.lab.home.arpa

# Экономим память: на стенде не нужны уведомления
dex:
  enabled: true 
notifications:
  enabled: false

configs:
  params:
    server.insecure: true
  cm:
    admin.enabled: "false"
    url: https://argocd.lab.home.arpa
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $argocd-github-oauth:clientID
            clientSecret: $argocd-github-oauth:clientSecret
  rbac:
    policy.default: ""
    scopes: "[groups, email]"
    policy.csv: |
      g, admin@example.com, role:admin
