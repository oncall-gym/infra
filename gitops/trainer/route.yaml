# LAN-only and unauthenticated for now: anyone who reaches it can create sessions.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trainer-api
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - trainer.lab.home.arpa
  rules:
    - backendRefs:
        - name: trainer-api
          port: 80
