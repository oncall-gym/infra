apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer-api
  labels:
    app.kubernetes.io/name: trainer-api
spec:
  # One replica: the expiry reaper and the session limit assume a single instance.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trainer-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trainer-api
    spec:
      serviceAccountName: trainer-api
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/oncall-gym/trainer-api:9a0f5163c9634330f2b716aa843e26beb53e277d
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MAX_SESSIONS
              value: "5"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: trainer-api
spec:
  selector:
    app.kubernetes.io/name: trainer-api
  ports:
    - name: http
      port: 80
      targetPort: http
